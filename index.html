<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AUD FX Dashboard (AUDUSD / AUDEUR)</title>
  <style>
    :root { --gap: 12px; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; }
    .wrap { height: 100%; display: grid; grid-template-rows: 120px 1fr; gap: var(--gap); padding: var(--gap); box-sizing: border-box; }
    .row { display: grid; grid-template-columns: 1fr; gap: var(--gap); min-height: 0; }
    @media (min-width: 1100px) {
      .row { grid-template-columns: 1fr 1fr; }
    }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; background: #fff; min-height: 0; }
    .card h2 { margin: 0; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #e5e7eb; background: #fafafa; }
    .tv { height: calc(100% - 41px); }
    .top { height: 120px; }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- 상단: 두 페어를 “가격 보드”로 한눈에 -->
    <div class="card top">
      <h2>Live Quotes (AUDUSD / AUDEUR)</h2>
      <div class="tv">
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-quotes.js" async>
          {
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "showSymbolLogo": true,
            "colorTheme": "light",
            "symbolsGroups": [
              {
                "name": "AUD Pairs",
                "symbols": [
                  { "name": "FX_IDC:AUDUSD", "displayName": "AUD / USD" },
                  { "name": "FX_IDC:AUDEUR", "displayName": "AUD / EUR" }
                ]
              }
            ]
          }
          </script>
        </div>
        <!-- TradingView Widget END -->
      </div>
    </div>

    <!-- 하단: 2개 차트를 나란히 -->
    <div class="row">

      <div class="card">
        <h2>Chart: AUDUSD</h2>
        <div class="tv">
          <!-- TradingView Widget BEGIN -->
          <div class="tradingview-widget-container" style="height:100%;width:100%">
            <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
              "autosize": true,
              "symbol": "FX_IDC:AUDUSD",
              "interval": "60",
              "timezone": "Asia/Seoul",
              "theme": "light",
              "style": "1",
              "locale": "kr",
              "withdateranges": true,
              "allow_symbol_change": false,
              "details": true,
              "calendar": false,
              "support_host": "https://www.tradingview.com"
            }
            </script>
          </div>
          <!-- TradingView Widget END -->
        </div>
      </div>

      <div class="card">
        <h2>Chart: AUDEUR</h2>
        <div class="tv">
          <!-- TradingView Widget BEGIN -->
          <div class="tradingview-widget-container" style="height:100%;width:100%">
            <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
            {
              "autosize": true,
              "symbol": "FX_IDC:AUDEUR",
              "interval": "60",
              "timezone": "Asia/Seoul",
              "theme": "light",
              "style": "1",
              "locale": "kr",
              "withdateranges": true,
              "allow_symbol_change": false,
              "details": true,
              "calendar": false,
              "support_host": "https://www.tradingview.com"
            }
            </script>
          </div>
          <!-- TradingView Widget END -->
        </div>
      </div>

    </div>
  </div>
</body>
</html>
